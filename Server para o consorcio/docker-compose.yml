# ══════════════════════════════════════════════
# KATARI — PostgreSQL via Docker
# ══════════════════════════════════════════════
# Sobe APENAS o PostgreSQL. O backend Node.js
# continua rodando local via npm run dev.
# ══════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: katari-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "099"
      POSTGRES_DB: consorcio
    volumes:
      - katari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consorcio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  katari_pgdata:
    driver: local
