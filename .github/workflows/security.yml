name: Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./Server para o consorcio
      
    - name: Run npm audit
      run: npm audit --audit-level=high
      working-directory: ./Server para o consorcio
      continue-on-error: true # Don't fail the build yet, just warn
      
    # Optional: static code analysis compatible with local WAF rules
    # - name: Scan for suspicious patterns
    #   run: grep -r "eval(" . || true
